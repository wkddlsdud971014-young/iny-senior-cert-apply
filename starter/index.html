<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두두자격지원센터</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="home on" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.75 20v-5.5h4.5V20"/></svg> 홈</a>
    <ul class="menu">
      <li><a href="apply.html">접수 신청</a></li>
      <li><a href="faq.html">물어보기</a></li>
    </ul>
    <ul class="util">
      <li><a href="check.html">접수 확인</a></li>
      <li><a href="admin/index.html" class="staff">직원용</a></li>
    </ul>
  </div>
</nav>

<div class="wrap">

  <div class="hero">
    <p class="eyebrow">중장년 · 시니어 국가기술자격</p>
    <h1><span class="light">자격증 접수,</span> 저희가 도와드립니다</h1>
    <p class="lead">
      그동안 전화로 물어보시고 종이에 적으시던 접수,
      이제 이 화면에서 이름과 연락처만 넣으시면 됩니다.
    </p>
  </div>

  <p class="steps-title">이렇게 하시면 됩니다</p>

  <div class="steps">
    <div class="step">
      <span class="n">1</span>
      <span class="t">자격증 고르기</span>
      <span class="d">아래에서 하나만<br>누르시면 됩니다</span>
    </div>
    <div class="step">
      <span class="n">2</span>
      <span class="t">이름 · 연락처</span>
      <span class="d">두 가지만<br>넣어 주십시오</span>
    </div>
    <div class="step">
      <span class="n">3</span>
      <span class="t">접수 완료</span>
      <span class="d">접수번호가 나오면<br>끝입니다</span>
    </div>
  </div>

  <button type="button" class="btn start" id="start-btn">접수하러 가기</button>

  <div class="cert-zone locked" id="cert-zone">
    <p class="cert-title" id="cert-title">어떤 자격증을 접수하시나요? 누르시면 신청서로 넘어갑니다</p>
    <div class="cert-grid" id="cert-grid"></div>
  </div>

</div>

<a class="float-chat" href="faq.html">💬 물어보기</a>

<script src="certs.js"></script>
<script>
// 자격증 카드를 그립니다. 정보는 certs.js 한 곳에만 있습니다.
(function () {
  document.getElementById("cert-grid").innerHTML = CERTIFICATES.map(function (c) {
    const fee = c.fee
      ? '<span class="fe">필기 응시료 <b>' + c.fee + '</b></span>'
      : '<span class="fe na">필기 응시료 확인 필요</span>';
    return '<a class="cert-link" href="apply.html?cert=' + encodeURIComponent(c.name) + '">' +
      '<span class="ico" aria-hidden="true">' + c.icon + '</span>' +
      '<span class="nm">' + c.name + (c.alias ? '<em>(' + c.alias + ')</em>' : '') + '</span>' +
      '<span class="og">' + c.org + '</span>' +
      '<span class="md">' + c.method + '</span>' +
      fee +
      (c.note ? '<span class="nt">' + c.note + '</span>' : '') +
      '</a>';
  }).join("");
})();

// 「접수하러 가기」를 누르기 전에는 자격증 칸을 흐리게 둡니다.
// 한 번에 여러 가지가 보이면 어디를 봐야 할지 헷갈리시기 때문입니다.
(function () {
  const btn  = document.getElementById("start-btn");
  const zone = document.getElementById("cert-zone");
  function openZone(smooth) {
    zone.classList.remove("locked");
    zone.classList.add("open");
    btn.hidden = true;
    zone.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "center" });
  }
  btn.addEventListener("click", function () { openZone(true); });

  // 다른 화면에서 "자격증 고르러 가기"로 오시면 바로 열어 드립니다.
  if (new URLSearchParams(location.search).get("open") === "1") openZone(false);
})();
</script>

</body>
</html>
