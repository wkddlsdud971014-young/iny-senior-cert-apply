<div class="wrap">

    <p class="lead">
      그동안 전화로 물어보시고 종이에 적으시던 접수,

  <button type="button" class="btn start" id="start-btn">접수하러 가기</button>

  <div class="cert-zone locked" id="cert-zone">
    <p class="cert-title" id="cert-title">어떤 자격증을 접수하시나요?</p>
    <div class="cert-grid" id="cert-grid"></div>
    <p class="exit-hint">다른 곳을 누르시면 돌아갑니다</p>
  </div>

</div>

<a class="float-chat" href="faq.html">💬 물어보기</a>

<script src="certs.js"></script>
<script>
// 자격증 카드를 그립니다. 정보는 certs.js 한 곳에만 있습니다.
(function () {
  document.getElementById("cert-grid").innerHTML = CERTIFICATES.map(function (c) {
    const fee = c.fee
      ? '<span class="fe">' + c.fee + '</span>'
      : '<span class="fe na">응시료 확인 필요</span>';

    // 지금 접수할 수 없는 자격증은 흐리게 두고 이유를 적습니다.
    // 아예 숨기면 "그 자격증은 안 다루나?" 하고 전화하시게 됩니다.
    if (!c.open) {
      return '<div class="cert-link closed">' +
        '<span class="ico" aria-hidden="true">' + c.icon + '</span>' +
        '<span class="nm">' + c.name + (c.alias ? '<em>' + c.alias + '</em>' : '') + '</span>' +
        '<span class="why">' + c.why + '</span>' +
        '<span class="closed-tag">' + c.closed + '</span>' +
        '</div>';
    }

    return '<a class="cert-link" href="apply.html?cert=' + encodeURIComponent(c.name) + '">' +
      '<span class="ico" aria-hidden="true">' + c.icon + '</span>' +
      '<span class="nm">' + c.name + (c.alias ? '<em>' + c.alias + '</em>' : '') + '</span>' +
      '<span class="why">' + c.why + '</span>' +
      fee +
      '</a>';
  }).join("");
})();

// 「접수하러 가기」를 누르면 자격증 고르는 칸만 남기고 나머지를 흐리게 합니다.
// 한 번에 한 가지만 보이면 어디를 봐야 할지 헷갈리지 않으십니다.
// 바깥 여백을 누르시면 다시 원래대로 돌아옵니다.
(function () {
  const btn  = document.getElementById("start-btn");
  const zone = document.getElementById("cert-zone");
  const body = document.body;

  function openZone(smooth) {
    body.classList.add("focus-mode");
    zone.classList.remove("locked");
    zone.classList.add("open");
    zone.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "center" });
  }
  function closeZone() {
    body.classList.remove("focus-mode");
    zone.classList.add("locked");
    zone.classList.remove("open");
  }

  btn.addEventListener("click", function (e) { e.stopPropagation(); openZone(true); });

  // 자격증 칸 바깥을 누르시면 빠져나옵니다.
  document.addEventListener("click", function (e) {
    if (!body.classList.contains("focus-mode")) return;
    if (zone.contains(e.target)) return;
    closeZone();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeZone();
  });

  // 다른 화면에서 "자격증 고르러 가기"로 오시면 바로 열어 드립니다.
  if (new URLSearchParams(location.search).get("open") === "1") openZone(false);
})();
</script>

<script src="chat.js"></script>

</body>
