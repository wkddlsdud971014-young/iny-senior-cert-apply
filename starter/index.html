<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자격증 접수 신청 · 두두자격지원센터</title>
<style>
  /* 글자와 버튼을 크게. 이용자 60대 38%, 70대 이상 14% */
  * { box-sizing: border-box; }

  body {
    font-family: system-ui, "Apple SD Gothic Neo", sans-serif;
    font-size: 20px;
    line-height: 1.7;
    color: #000;
    background: #fff;
    margin: 0;
    padding: 24px 16px 80px;
  }

  .wrap { max-width: 760px; margin: 0 auto; }

  h1 { font-size: 32px; margin: 0 0 8px; }
  h2 { font-size: 26px; margin: 40px 0 16px; }
  .lead { margin: 0 0 8px; }
  .scope { font-weight: bold; border: 3px solid #000; padding: 12px 16px; margin: 16px 0 0; }

  .step-no {
    display: inline-block; width: 38px; height: 38px; line-height: 38px;
    text-align: center; background: #000; color: #fff; border-radius: 50%;
    font-size: 22px; margin-right: 8px;
  }

  /* ----- 자격증 카드 ----- */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }

  .card {
    display: block; width: 100%; text-align: left;
    font-family: inherit; font-size: 20px; color: #000; background: #fff;
    border: 3px solid #767676; padding: 16px; cursor: pointer;
  }
  .card:hover { border-color: #000; }
  .card:focus-visible { outline: 4px solid #000; outline-offset: 3px; }

  /* 선택 표시를 색이 아니라 테두리와 글자로. 색약이신 분도 구분 가능 */
  .card.on { border: 6px solid #000; background: #eee; }

  .card .cert-name { font-size: 24px; font-weight: bold; display: block; }
  .card .cert-info { font-size: 17px; color: #333; display: block; margin-top: 4px; }
  .card .cert-fee  { font-size: 20px; font-weight: bold; display: block; margin-top: 8px; }
  .card .cert-note { font-size: 17px; display: block; margin-top: 8px; border-top: 2px solid #ccc; padding-top: 8px; }
  .card .picked { display: none; font-size: 20px; font-weight: bold; margin-top: 10px; }
  .card.on .picked { display: block; }

  /* ----- 입력칸 ----- */
  label { display: block; font-size: 22px; font-weight: bold; margin: 24px 0 6px; }
  .optional { font-weight: normal; font-size: 18px; }

  input, textarea {
    width: 100%; font-family: inherit; font-size: 20px;
    padding: 14px; min-height: 58px;
    border: 3px solid #000; background: #fff; color: #000;
  }
  textarea { min-height: 96px; }
  input:focus, textarea:focus { outline: 4px solid #000; outline-offset: 2px; }

  .help { font-size: 17px; color: #333; margin: 6px 0 0; }

  /* ----- 버튼 ----- */
  button.send {
    width: 100%; margin-top: 32px;
    font-family: inherit; font-size: 24px; font-weight: bold;
    padding: 20px; min-height: 68px;
    color: #fff; background: #000; border: 3px solid #000; cursor: pointer;
  }
  button.send:disabled { background: #767676; border-color: #767676; cursor: default; }

  /* ----- 안내 문구 ----- */
  #msg { font-size: 20px; font-weight: bold; margin: 20px 0 0; }
  #msg.warn { border: 3px solid #000; padding: 14px; }

  /* ----- 접수 완료 ----- */
  #done { border: 6px solid #000; padding: 24px; margin-top: 24px; }
  #done h2 { margin-top: 0; }
  #done .num { font-size: 56px; font-weight: bold; display: block; margin: 12px 0; }
  #done dl { margin: 20px 0 0; }
  #done dt { font-weight: bold; margin-top: 12px; }
  #done dd { margin: 0; }
</style>
</head>

<body>
<div class="wrap">

  <h1>자격증 접수 신청</h1>
  <p class="lead">두두자격지원센터</p>
  <p class="scope">저희는 필기 접수만 도와드립니다. 실기는 안내하지 않습니다.</p>

  <form id="apply-form">

    <h2><span class="step-no">1</span>어떤 자격증을 접수하시나요?</h2>
    <div class="cards" id="cert-list"></div>

    <h2><span class="step-no">2</span>신청하시는 분</h2>

    <label for="name">이름</label>
    <input id="name" type="text" autocomplete="name">

    <label for="phone">연락처</label>
    <input id="phone" type="tel" autocomplete="tel">
    <p class="help">숫자만 넣으시면 됩니다. - 는 저희가 붙여 드립니다.</p>

    <label for="note">더 하실 말씀 <span class="optional">(안 쓰셔도 됩니다)</span></label>
    <textarea id="note"></textarea>

    <p id="msg" role="status"></p>

    <button type="submit" class="send" id="send-btn">신청서 보내기</button>
  </form>

  <section id="done" hidden>
    <h2 id="done-title">접수 완료되었습니다</h2>
    <p>접수번호</p>
    <span class="num" id="done-no"></span>
    <p>이 번호를 적어 두시거나 화면을 사진으로 찍어 두십시오.</p>
    <dl>
      <dt>신청한 자격증</dt><dd id="done-cert"></dd>
      <dt>이름</dt><dd id="done-name"></dd>
      <dt>접수한 때</dt><dd id="done-at"></dd>
    </dl>
  </section>

</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
