<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>접수 확인 · 두두자격지원센터</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">

    <div class="nav-top">
      <a class="brand" href="index.html">
        <span class="logo-mark" aria-hidden="true">두두</span>
        <span class="logo-name">두두자격지원센터</span>
      </a>
      <ul class="util">
        <li><a href="check.html" class="on">접수 확인</a></li>
        <li><a href="admin/integrated.html">직원용</a></li>
      </ul>
    </div>

    <div class="nav-bottom">
      <a class="home" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.75 20v-5.5h4.5V20"/></svg> 홈</a>
      <ul class="menu">
        <li><a href="apply.html">접수 신청</a></li>
        <li><a href="faq.html">물어보기</a></li>
      </ul>
    </div>

  </div>
</nav>

<div class="wrap">

  <h1>접수가 잘 되었는지 확인하기</h1>
  <p class="lead" style="font-size:19px;color:var(--ink-soft);margin:0 0 22px;">
    신청하실 때 넣으신 <b>이름</b>과 <b>연락처</b>를 넣으시면 접수 내역을 보여 드립니다.
  </p>

  <div class="card">
    <h2>넣어 주십시오</h2>

    <form id="check-form">
      <div class="field" id="c-name">
        <label for="cname">이름</label>
        <input id="cname" type="text" autocomplete="name">
        <p class="help">다 넣으시면 <b>엔터</b>를 누르십시오</p>
      </div>

      <div class="field" id="c-phone">
        <label for="cphone">연락처</label>
        <input id="cphone" type="tel" autocomplete="tel">
      </div>

      <p id="cmsg"></p>
      <button type="submit" class="btn wide" id="find-btn">접수 내역 찾기</button>
    </form>
  </div>

</div>

<!-- 찾은 결과는 화면 가운데에 띄웁니다. 아래에 생기면 못 보고 지나치십니다. -->
<div class="modal" id="result-modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="rm-head">
    <button type="button" class="modal-close" id="rm-close" aria-label="닫기">✕</button>
    <div id="result"></div>
    <div class="btn-row done-btns" id="rm-actions" hidden>
      <button type="button" class="btn" id="rm-print">🖨 인쇄하기</button>
      <button type="button" class="btn ghost" id="rm-copy">📋 접수 내용 복사</button>
    </div>
    <button type="button" class="btn wide" id="rm-ok">닫기</button>
  </div>
</div>


<a class="float-chat" href="faq.html">💬 물어보기</a>

<script src="certs.js"></script>
<script src="phone.js"></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// =============================================================
// 접수 확인
//
// 이름과 연락처가 둘 다 맞아야 보여 드립니다.
// 연락처는 판정 컬럼(phone_digits, 숫자만)으로 맞춰 봅니다.
// 하이픈을 넣으셨든 안 넣으셨든 찾아집니다.
// =============================================================
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const nameBox  = document.getElementById("cname");
const phoneBox = document.getElementById("cphone");
const msg      = document.getElementById("cmsg");
const btn      = document.getElementById("find-btn");
const out      = document.getElementById("result");
const modal    = document.getElementById("result-modal");

const esc = v => String(v == null ? "" : v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function say(t)    { msg.textContent = t; msg.className = "warn"; }
function clearSay(){ msg.textContent = "";  msg.className = "";     }


// ----- 연락처 -----
// 하이픈 붙이기(hyphenPhone)는 phone.js 에 있습니다. 접수 화면과 같은 파일입니다.
//
// 전에는 이 화면이 하이픈 함수를 따로 갖고 있었고 02 지역번호를 몰랐습니다.
// 그래서 접수하실 때는 02-123-4567 로 보이던 번호가 여기서는 021-234-567 로
// 보였습니다. 같은 번호인데 화면마다 달리 보이면 "내가 잘못 넣었나" 하십니다.
//
// 다만 여기서는 접수 화면만큼 깐깐하게 막지 않습니다.
// 이 화면은 값을 저장하는 곳이 아니라 이미 저장된 것을 찾아 드리는 곳입니다.
// 예전에 전화로 접수해 드린 분의 번호는 지금 규칙에 안 맞을 수도 있는데,
// 규칙에 맞지 않는다고 찾기를 막으면 본인 접수를 못 보십니다.


// ----- 다음에 하실 차례를 표시 (접수 화면과 같은 방식) -----
function updateNext() {
  ["c-name", "c-phone", "find-btn"].forEach(function (id) {
    document.getElementById(id).classList.remove("next-up");
  });
  const now = document.activeElement;
  let id;
  if (now === nameBox)                        id = "c-name";
  else if (now === phoneBox)                  id = "c-phone";
  else if (nameBox.value.trim() === "")       id = "c-name";
  else if (phoneBox.value.trim() === "")      id = "c-phone";
  else                                        id = "find-btn";
  document.getElementById(id).classList.add("next-up");
}


// ----- 다음 칸으로 옮겨 드리기 -----
function goTo(el) {
  if (!el) return;
  el.focus({ preventScroll: true });
  (el.closest(".field") || el).scrollIntoView({ behavior: "smooth", block: "center" });
}
// 한글을 칠 때 엔터는 글자를 완성하는 역할도 합니다.
function isTypingHangul(e) { return e.isComposing || e.keyCode === 229; }

nameBox.addEventListener("keydown", function (e) {
  if (e.key !== "Enter" || isTypingHangul(e)) return;
  e.preventDefault();
  if (nameBox.value.trim() !== "") goTo(phoneBox);
});
phoneBox.addEventListener("input", function () {
  phoneBox.value = hyphenPhone(phoneBox.value);
  updateNext();
  // 번호를 다 넣으시면 찾기 버튼으로.
  // 전에는 11자리인지만 셌습니다. 그러면 02-1234-5678(10자리)로 접수하신 분은
  // 다 넣으셔도 버튼으로 넘어가지 않았습니다. 이제 번호대별 자릿수로 봅니다.
  if (phoneDone(phoneBox.value)) setTimeout(function(){ goTo(btn); }, 250);
});
[nameBox, phoneBox].forEach(function (el) {
  el.addEventListener("input", updateNext);
  el.addEventListener("focus", updateNext);
  el.addEventListener("blur", function () { setTimeout(updateNext, 0); });
});
updateNext();


// ----- 결과 모달 -----
let FOUND = [];   // 찾은 접수. 인쇄·복사에 씁니다.

function showResult(hasRows) {
  modal.hidden = false;
  document.body.style.overflow = "hidden";
  document.getElementById("rm-actions").hidden = !hasRows;
  document.getElementById("rm-ok").focus();
}

// 인쇄하기 — 찾은 내용만 종이에 나옵니다.
document.getElementById("rm-print").addEventListener("click", function () {
  window.print();
});

// 접수 내용 복사 — 자녀분께 문자로 보내실 수 있게.
document.getElementById("rm-copy").addEventListener("click", async function (e) {
  const t = FOUND.map(function (r) {
    const c = certByName(r.certificate_std || r.certificate);
    const fee = (c && c.fee) ? " (필기 응시료 " + c.fee + ")" : "";
    const d = new Date(r.created_at);
    const when = d.getFullYear() + "년 " + (d.getMonth()+1) + "월 " + d.getDate() + "일 " +
                 String(d.getHours()).padStart(2,"0") + "시 " + String(d.getMinutes()).padStart(2,"0") + "분";
    return "[두두자격지원센터 접수 확인]\n" +
           "접수번호: " + r.id + "\n" +
           "신청 자격증: " + (c ? c.name : r.certificate) + fee + "\n" +
           "이름: " + r.name + "\n" +
           "연락처: " + r.phone + "\n" +
           "접수한 때: " + when;
  }).join("\n\n");
  try {
    await navigator.clipboard.writeText(t);
    e.target.textContent = "✅ 복사했습니다";
  } catch (err) {
    e.target.textContent = "복사가 안 됩니다. 화면을 사진으로 찍어 주십시오";
  }
  setTimeout(function () { e.target.textContent = "📋 접수 내용 복사"; }, 2500);
});
function closeResult() {
  modal.hidden = true;
  document.body.style.overflow = "";
}
document.getElementById("rm-ok").addEventListener("click", closeResult);
document.getElementById("rm-close").addEventListener("click", closeResult);
modal.addEventListener("click", function (e) { if (e.target === modal) closeResult(); });
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && !modal.hidden) closeResult();
});


// ----- 찾기 -----
document.getElementById("check-form").addEventListener("submit", async function (e) {
  e.preventDefault();
  clearSay(); out.innerHTML = "";

  const nm = nameBox.value.trim();
  const dg = phoneBox.value.replace(/[^0-9]/g, "");

  if (nm === "") { say("이름을 넣어 주십시오."); nameBox.focus(); return; }
  if (dg === "") { say("연락처를 넣어 주십시오."); phoneBox.focus(); return; }

  btn.disabled = true; btn.textContent = "찾는 중입니다...";

  const { data, error } = await db
    .from("applications")
    .select("id, created_at, name, phone, certificate, certificate_std, note")
    .eq("phone_digits", dg)
    .order("created_at", { ascending: false });

  btn.disabled = false; btn.textContent = "접수 내역 찾기";

  if (error) { say("찾지 못했습니다. 잠시 뒤에 다시 눌러 주십시오. (" + error.message + ")"); return; }

  // 이름은 앞뒤 공백을 빼고 견줍니다. 저장된 원본은 그대로 둡니다.
  const rows = (data || []).filter(function (r) { return (r.name || "").trim() === nm; });

  if (rows.length === 0) {
    out.innerHTML =
      '<h2 id="rm-head">접수 내역이 없습니다</h2>' +
      '<p>넣으신 이름과 연락처로 된 접수를 찾지 못했습니다.</p>' +
      '<ul class="list">' +
      '<li>이름을 신청하실 때와 <b>똑같이</b> 넣으셨는지 보십시오.</li>' +
      '<li>연락처를 <b>다른 번호</b>로 넣지 않으셨는지 보십시오.</li>' +
      '</ul>' +
      '<div class="btn-row"><a class="btn" href="index.html?open=1">새로 접수하러 가기</a></div>';
    FOUND = [];
    showResult(false);
    return;
  }

  out.innerHTML = '<h2 id="rm-head">접수 ' + rows.length + '건을 찾았습니다</h2>' +
    rows.map(function (r) {
      const c   = certByName(r.certificate_std || r.certificate);
      const fee = (c && c.fee) ? '필기 응시료 ' + c.fee : '필기 응시료 확인 필요';
      const t   = new Date(r.created_at);
      const when = t.getFullYear() + "년 " + (t.getMonth()+1) + "월 " + t.getDate() + "일 " +
                   String(t.getHours()).padStart(2,"0") + "시 " + String(t.getMinutes()).padStart(2,"0") + "분";
      const cname = c ? (c.alias ? c.name + " (" + c.alias + ")" : c.name) : r.certificate;
      return '<div class="found">' +
        '<div class="found-top"><span class="lbl">접수번호</span><span class="num">' + r.id + '</span>' +
        '<span class="state">담당자 확인 중</span></div>' +
        '<dl>' +
        '<dt>신청한 자격증</dt><dd>' + esc(cname) + '</dd>' +
        '<dt>응시료</dt><dd>' + fee + '</dd>' +
        '<dt>이름</dt><dd>' + esc(r.name) + '</dd>' +
        '<dt>연락처</dt><dd>' + esc(r.phone) + '</dd>' +
        (r.note && r.note.trim() ? '<dt>남기신 말씀</dt><dd>' + esc(r.note) + '</dd>' : '') +
        '<dt>접수한 때</dt><dd>' + when + '</dd>' +
        '</dl></div>';
    }).join("") +
    '<p class="help">담당자가 자격 요건을 확인한 뒤 연락드립니다.</p>';
  FOUND = rows;
  showResult(true);
});
</script>
<script src="chat.js"></script>

</body>
</html>
