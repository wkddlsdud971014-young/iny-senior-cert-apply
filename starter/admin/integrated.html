<div id="lock">
  <h1>직원용 화면입니다</h1>
  <p>비밀번호를 넣어 주십시오.</p>
  <form id="lock-form">
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" maxlength="8">
    <button type="submit">들어가기</button>
  </form>
  <p class="err" id="lock-err" hidden>비밀번호가 맞지 않습니다.</p>
  <p><a href="../index.html">← 홈으로 돌아가기</a></p>

<div class="wrap" id="main" hidden>

  <h1>접수 내역</h1>
  <p class="sub">두두넷 국가기술 · 두두넷 전문 · 두두보건 · 우리 접수를 한 표로 모은 것입니다</p>

  <div class="subtabs">
    <a href="integrated.html" class="on">접수 내역</a>
    <a href="faq.html">문서 고치기</a>

  <p id="msg">불러오는 중입니다...</p>

  <div class="counts" id="counts"></div>

  <h2>자격증별 · 출처별</h2>
  <div class="scroll"><table id="cross"></table></div>

  <h2>결제상태 · 감면유형 · 사용맥락</h2>
  <div class="mini-tables">
    <div class="scroll"><table id="t-pay"></table></div>
    <div class="scroll"><table id="t-dis"></table></div>
    <div class="scroll"><table id="t-use"></table></div>
  </div>

  <h2>접수 목록</h2>
  <div class="bar">
    <input type="text" id="q" placeholder="이름 · 접수번호 검색">
    <select id="f-src"><option value="">출처 전체</option></select>
    <select id="f-cert"><option value="">자격증 전체</option></select>
    <button id="btn-find">찾기</button>
    <button class="ghost" id="btn-reset">지우기</button>
    <label class="chk"><input type="checkbox" id="show-when"> 접수일시 보기</label>
    <label class="chk"><input type="checkbox" id="show-orig"> 원본 값도 보기</label>
  </div>
  <p id="list-info"></p>

  <div class="bar">
    <button class="ghost" id="prev">← 이전</button>
    <span id="page-info"></span>

<script>
const ADMIN_PW = "0000", KEY = "admin-ok";
const lock = document.getElementById("lock"), main = document.getElementById("main");
function unlock(){ lock.hidden = true; main.hidden = false; if (window.startPage) window.startPage(); }
if (sessionStorage.getItem(KEY) === "1") unlock(); else document.getElementById("pw").focus();
document.getElementById("lock-form").addEventListener("submit", function(e){
  e.preventDefault();
  const pw = document.getElementById("pw");
  if (pw.value === ADMIN_PW) { sessionStorage.setItem(KEY,"1"); unlock(); }
  else { document.getElementById("lock-err").hidden = false; pw.value = ""; pw.focus(); }
});
</script>

<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// =============================================================
// 통합 접수 내역
//
// 표준 칸을 기준으로 세고, "원본 값도 보기"를 켜면 원본 칸을 함께 보여줍니다.
// 빈 칸은 "없음"이 아니라 "-" 로 표시합니다. 없는 것과 0은 다릅니다.
// =============================================================
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const PER = 50;
let ALL = [], VIEW = [], page = 1;

const $ = id => document.getElementById(id);
const esc = v => String(v == null ? "" : v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const cell = v => (v == null || String(v).trim() === "") ? '<span class="blank">-</span>' : esc(v);

// 우리 접수를 통합표와 같은 모양으로 바꿉니다.
// 표를 합치지 않고 화면에서만 나란히 놓습니다.
// integrated_applications 는 원본이라 손대지 않기 위해서입니다.
function fromOurs(r) {
  return {
    _ours: true, _id: r.id,
    "출처": "우리접수",
    "접수번호": String(r.id),
    "성명": r.name,
    "생년월일": r.staff_birth,
    "성별": r.staff_gender,
    "연락처": r.phone,
    "자격증": r.certificate_std || r.certificate,
    "시험지역": r.staff_region,
    "시험장": r.staff_center,
    "시험일자": r.staff_exam_date,
    "결제수단": r.staff_pay_method,
    "결제상태": r.staff_pay_status,
    "접수상태": r.staff_app_status,
    "접수일시": r.created_at,
    "최종결제금액": "",
    "감면유형": "",
    "사용맥락": "",
  };
}

async function load() {
  $("msg").textContent = "불러오는 중입니다...";
  const a = await db.from("integrated_applications").select("*").order("id").limit(2000);
  const b = await db.from("applications").select("*").order("id");
  if (a.error) { $("msg").textContent = "불러오지 못했습니다. (" + a.error.message + ")"; return; }
  const ours = (b.data || []).map(fromOurs);
  // 최신 접수가 맨 위로 오게 접수일시 내림차순으로 놓습니다.
  // 직원이 "방금 들어온 건"을 먼저 봐야 하기 때문입니다.
  const data = ours.concat(a.data || []).sort(function (x, y) {
    return String(y["접수일시"] || "").localeCompare(String(x["접수일시"] || ""));
  });
  ALL = data; VIEW = data;
  $("msg").textContent = "";
  drawCounts(); drawCross(); drawSmall(); fillFilters(); drawList();
}

function count(rows, col) {
  const m = {};
  rows.forEach(r => { const k = (r[col] || "").trim() || "(빈 칸)"; m[k] = (m[k]||0)+1; });
  return m;
}

// 한국 날짜로 오늘인지 봅니다.
// Supabase 는 세계표준시로 저장해서, 그대로 세면 새벽 9시 이전 건이 어제로 잡힙니다.
const KST = "Asia/Seoul";
function kstDay(v) {
  if (!v) return "";
  const t = String(v);
  const d = new Date(t.length <= 10 ? t + "T00:00:00+09:00" : t);
  return isNaN(d) ? t.slice(0, 10) : d.toLocaleDateString("sv-SE", { timeZone: KST });
}
const todayKST = () => new Date().toLocaleDateString("sv-SE", { timeZone: KST });

function drawCounts() {
  const by = count(ALL, "출처");
  const today = todayKST();
  const todayN = ALL.filter(r => kstDay(r["접수일시"]) === today).length;
  const won = ALL.reduce((s,r) => s + (parseInt(r["최종결제금액"],10) || 0), 0);
  const need = ALL.filter(r => r._ours && EDITABLE.some(c => !String(r[c[0]] || "").trim())).length;
  $("counts").innerHTML =
    box("오늘 접수", todayN.toLocaleString() + "건") +
    box("전체 접수", ALL.length.toLocaleString() + "건") +
    ["우리접수","국가기술","전문","두두보건"].map(k => box(k, (by[k]||0).toLocaleString() + "건")).join("") +
    box("확인 필요", need + "건", need > 0);
}
const box = (label, num, warn) => `<div class="box${warn ? " warn" : ""}"><span class="label">${label}</span><span class="num">${num}</span></div>`;

function drawCross() {
  const srcs = ["우리접수","국가기술","전문","두두보건"];
  const certs = [...new Set(ALL.map(r => r["자격증"]))].sort();
  let h = "<tr><th>자격증</th>" + srcs.map(s=>`<th class="num">${s}</th>`).join("") + '<th class="num">합계</th></tr>';
  certs.forEach(c => {
    const row = srcs.map(s => ALL.filter(r => r["자격증"]===c && r["출처"]===s).length);
    const sum = row.reduce((a,b)=>a+b,0);
    h += `<tr><td>${esc(c)}</td>` + row.map(n=>`<td class="num">${n||'<span class="blank">-</span>'}</td>`).join("") + `<td class="num"><b>${sum}</b></td></tr>`;
  });
  const tot = srcs.map(s => ALL.filter(r => r["출처"]===s).length);
  h += `<tr class="total"><td>합계</td>` + tot.map(n=>`<td class="num">${n}</td>`).join("") + `<td class="num">${ALL.length}</td></tr>`;
  $("cross").innerHTML = h;
}

function drawSmall() {
  const mk = (title, col) => {
    const m = count(ALL, col);
    const keys = Object.keys(m).sort((a,b)=>m[b]-m[a]);
    return `<tr><th>${title}</th><th class="num">건수</th></tr>` +
      keys.map(k=>`<tr><td>${esc(k)}</td><td class="num">${m[k]}</td></tr>`).join("");
  };
  $("t-pay").innerHTML = mk("결제상태","결제상태");
  $("t-dis").innerHTML = mk("감면유형","감면유형");
  $("t-use").innerHTML = mk("사용맥락","사용맥락");
}

function fillFilters() {
  const add = (sel, vals) => vals.forEach(v => {
    const o = document.createElement("option"); o.value = v; o.textContent = v; $(sel).appendChild(o);
  });
  add("f-src", ["우리접수","국가기술","전문","두두보건"]);
  add("f-cert", [...new Set(ALL.map(r=>r["자격증"]))].sort());
}

const COLF = {};   // 칸마다 거르는 말

function applyFilter() {
  const q = $("q").value.trim();
  const s = $("f-src").value, c = $("f-cert").value;
  VIEW = ALL.filter(function (r) {
    if (s && r["출처"] !== s) return false;
    if (c && r["자격증"] !== c) return false;
    if (q && !(r["성명"]||"").includes(q) && !(r["접수번호"]||"").includes(q)) return false;
    for (const col in COLF) {
      const want = COLF[col];
      const has  = String(r[col] || "").trim();
      if (want === "(빈 칸)") { if (has !== "") return false; }
      else if (want && has !== want) return false;
    }
    return true;
  });
  page = 1; drawList();
}

function drawList() {
  const showOrig = $("show-orig").checked;
  const total = VIEW.length, pages = Math.max(1, Math.ceil(total/PER));
  if (page > pages) page = pages;
  const rows = VIEW.slice((page-1)*PER, page*PER);

  $("list-info").textContent = `${total.toLocaleString()}건 중 ${rows.length}건 표시`;
  $("page-info").textContent = `${page} / ${pages} 쪽`;
  $("prev").disabled = page <= 1; $("next").disabled = page >= pages;

  // 칸을 숨기지 않고 다 보여 드립니다. 대신 글자를 작게 씁니다.
  let cols = [["출처","출처"],["접수번호","접수번호"],["성명","성명"],
              ["생년월일","생년월일","생년월일_원본"],["성별","성별","성별_원본"],
              ["연락처","연락처","연락처_원본"],["자격증","자격증"],
              ["지역","시험지역"],["시험장","시험장"],
              ["시험일자","시험일자","시험일자_원본"],
              ["결제수단","결제수단","결제수단_원본"],["결제상태","결제상태","결제상태_원본"],
              ["접수상태","접수상태","접수상태_원본"]];
  // 접수일시는 칸을 많이 차지해서 체크하셨을 때만 보여 드립니다.
  if ($("show-when").checked) cols.push(["접수일시","접수일시","접수일시_원본"]);
  if (!showOrig) cols = cols.map(c => [c[0], c[1]]);

  // 표머리마다 거르기 화살표. 엑셀처럼 눌러서 값을 고릅니다.
  let h = "<tr>" + cols.map(function (c) {
    const on = COLF[c[1]] ? " on" : "";
    return `<th><span class="th-in">${c[0]}` +
           `<button type="button" class="fbtn${on}" data-col="${c[1]}" title="거르기">▾</button>` +
           `</span></th>`;
  }).join("") + "</tr>";
  rows.forEach(r => {
    h += "<tr>" + cols.map(c => {
      // 우리 접수 건의 빈 칸에는 「확인 필요」를 띄웁니다. 누르면 채울 수 있습니다.
      const ed = r._ours ? EDITABLE.find(x => x[0] === c[1]) : null;
      let v;
      if (ed && !String(r[c[1]] || "").trim()) {
        v = '<button type="button" class="need" data-id="' + r._id + '" data-col="' + c[1] + '">확인 필요</button>';
      } else if (ed) {
        v = '<button type="button" class="filled" data-id="' + r._id + '" data-col="' + c[1] + '">' + esc(r[c[1]]) + '</button>';
      } else {
        v = cell(r[c[1]]);
      }
      if (c[2] && (r[c[2]]||"").trim() !== "" && r[c[2]] !== r[c[1]])
        v += `<br><span class="orig">원본 ${esc(r[c[2]])}</span>`;
      return `<td>${v}</td>`;
    }).join("") + "</tr>";
  });
  $("list").innerHTML = h;
}

$("btn-find").addEventListener("click", applyFilter);
$("q").addEventListener("keydown", e => { if (e.key === "Enter") applyFilter(); });
$("f-src").addEventListener("change", applyFilter);
$("f-cert").addEventListener("change", applyFilter);
$("btn-reset").addEventListener("click", () => {
  $("q").value=""; $("f-src").value=""; $("f-cert").value="";
  for (const k in COLF) delete COLF[k];
  applyFilter();
});

// ---------- 표머리 거르기 ----------
// 화살표를 누르면 그 칸에 실제로 들어 있는 값들이 나옵니다.
// 값이 많은 칸(성명·접수번호)은 찾기 칸으로 씁니다.

let fpop = null;
function closePop() { if (fpop) { fpop.remove(); fpop = null; } }

$("list").addEventListener("click", function (e) {
  const b = e.target.closest(".fbtn");
  if (!b) return;
  e.stopPropagation();
  const col = b.dataset.col;
  const was = fpop && fpop.dataset.col === col;
  closePop();
  if (was) return;

  // 이 칸에 들어 있는 값 모으기 (지금 걸린 다른 조건은 무시하고 전체 기준)
  const m = {};
  ALL.forEach(function (r) {
    const v = String(r[col] || "").trim() || "(빈 칸)";
    m[v] = (m[v] || 0) + 1;
  });
  const vals = Object.keys(m).sort(function (x, y) { return m[y] - m[x]; });

  fpop = document.createElement("div");
  fpop.className = "fpop";
  fpop.dataset.col = col;
  fpop.innerHTML =
    '<div class="fpop-head">' + col + ' 거르기</div>' +
    (vals.length > 12 ? '<input type="text" class="fpop-q" placeholder="찾기">' : '') +
    '<button type="button" class="fpop-all">전체 보기</button>' +
    '<div class="fpop-list">' +
      vals.slice(0, 200).map(function (v) {
        const sel = COLF[col] === v ? " on" : "";
        return '<button type="button" class="fpop-v' + sel + '" data-v="' + esc(v) + '">' +
               '<span>' + esc(v) + '</span><b>' + m[v] + '</b></button>';
      }).join("") +
    '</div>';

  const r = b.getBoundingClientRect();
  fpop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 240)) + "px";
  fpop.style.top  = (r.bottom + window.scrollY + 4) + "px";
  document.body.appendChild(fpop);

  const q = fpop.querySelector(".fpop-q");
  if (q) {
    q.focus();
    q.addEventListener("input", function () {
      const w = q.value.trim();
      fpop.querySelectorAll(".fpop-v").forEach(function (el) {
        el.hidden = w !== "" && !el.dataset.v.includes(w);
      });
    });
  }

  fpop.addEventListener("click", function (ev) {
    ev.stopPropagation();
    if (ev.target.closest(".fpop-all")) { delete COLF[col]; closePop(); applyFilter(); return; }
    const v = ev.target.closest(".fpop-v");
    if (v) { COLF[col] = v.dataset.v; closePop(); applyFilter(); }
  });
});

document.addEventListener("click", closePop);
window.addEventListener("scroll", closePop);
$("show-orig").addEventListener("change", drawList);
$("show-when").addEventListener("change", drawList);
$("prev").addEventListener("click", () => { if (page>1){ page--; drawList(); window.scrollTo(0,document.getElementById("list").offsetTop-80);} });
$("next").addEventListener("click", () => { page++; drawList(); window.scrollTo(0,document.getElementById("list").offsetTop-80); });

// ---------- 담당자가 채우는 칸 ----------
// 값 목록은 data/01_form_정책.md 에 적힌 것만 씁니다. 손으로 치면 오타가 납니다.
const REGIONS = ["서울","부산","대구","인천","광주","대전","울산","세종","경기","강원","충북","충남","전북","전남","경북","경남","제주"];
const EDITABLE = [
  ["생년월일", "staff_birth",      "date"],
  ["성별",     "staff_gender",     "select", ["남","여"]],
  ["시험지역", "staff_region",     "select", REGIONS],
  ["시험장",   "staff_center",     "text"],
  ["시험일자", "staff_exam_date",  "date"],
  ["결제수단", "staff_pay_method", "select", ["신용카드","계좌이체","가상계좌"]],
  ["결제상태", "staff_pay_status", "select", ["완료","대기","환불"]],
  // 우리 접수는 발주서 3절의 4단계를 씁니다.
  // 통합 데이터의 '접수완료'는 두두넷 원서접수까지 마친 4단계라 뜻이 다릅니다.
  ["접수상태", "staff_app_status", "select", ["접수","확인","완료","취소"]],
];

$("list").addEventListener("click", function (e) {
  const btn = e.target.closest(".need, .filled");
  if (!btn) return;
  openEdit(Number(btn.dataset.id), btn.dataset.col, btn);
});

function openEdit(id, col, btn) {
  const spec = EDITABLE.find(x => x[0] === col);
  const row  = ALL.find(r => r._ours && r._id === id);
  const now  = row[col] || "";

  let input;
  if (spec[2] === "select") {
    input = document.createElement("select");
    input.innerHTML = '<option value="">고르십시오</option>' +
      spec[3].map(v => '<option' + (v === now ? " selected" : "") + '>' + v + '</option>').join("");
  } else {
    input = document.createElement("input");
    input.type = spec[2] === "date" ? "date" : "text";
    input.value = now;
  }
  input.className = "cell-edit";

  btn.replaceWith(input);
  input.focus();

  let done = false;
  async function save() {
    if (done) return;
    done = true;
    const val = input.value.trim();
    const patch = {}; patch[spec[1]] = val === "" ? null : val;
    const { error } = await db.from("applications").update(patch).eq("id", id);
    if (error) { alert("저장하지 못했습니다.\n" + error.message); }
    else { row[col] = val; }
    drawList(); drawCounts();
  }
  input.addEventListener("blur", save);
  input.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") { ev.preventDefault(); input.blur(); }
    if (ev.key === "Escape") { done = true; drawList(); }
  });
  if (spec[2] === "select") input.addEventListener("change", save);
}

window.startPage = load;
if (!main.hidden) load();
</script>
</body>
</html>
