<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문서 고치기 · 두두자격지원센터</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div id="lock">
  <h1>직원용 화면입니다</h1>
  <p>비밀번호를 넣어 주십시오.</p>
  <form id="lock-form">
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" maxlength="8">
    <button type="submit">들어가기</button>
  </form>
  <p id="lock-err" hidden style="font-weight:700;">비밀번호가 맞지 않습니다.</p>
  <p><a href="../index.html">← 홈으로 돌아가기</a></p>
</div>

<nav class="nav">
  <div class="nav-inner">
    <a class="home" href="../index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.75 20v-5.5h4.5V20"/></svg> 홈</a>
    <ul class="menu">
      <li><a href="../apply.html">접수 신청</a></li>
      <li><a href="../faq.html">물어보기</a></li>
    </ul>
    <ul class="util">
      <li><a href="../check.html">접수 확인</a></li>
      <li><a href="index.html" class="on">직원용</a></li>
    </ul>
  </div>
</nav>

<div class="wrap" id="main" hidden>

  <h1>챗봇 문서 고치기</h1>
  <p class="sub">여기서 고치시면 챗봇이 바로 그 내용으로 답합니다</p>

  <div class="subtabs">
    <a href="index.html">우리 접수</a>
    <a href="integrated.html">통합 내역</a>
    <a href="faq.html" class="on">문서 고치기</a>
  </div>


  <div class="hint">
    <b>문서에 없는 내용은 적지 마십시오.</b>
    챗봇은 여기 적힌 것만 보고 답합니다. 확인하지 못한 금액이나 날짜를 적으시면
    챗봇이 그대로 안내해서 항의를 받게 됩니다.
  </div>

  <div class="bar">
    <button id="reload">새로 불러오기</button>
    <button class="ghost" id="add">문서 새로 만들기</button>
    <span id="msg"></span>
  </div>

  <div id="list"></div>
</div>

<script>
const ADMIN_PW = "0000", KEY = "admin-ok";
const lock = document.getElementById("lock"), main = document.getElementById("main");
function unlock(){ lock.hidden = true; main.hidden = false; if (window.start) window.start(); }
if (sessionStorage.getItem(KEY) === "1") unlock(); else document.getElementById("pw").focus();
document.getElementById("lock-form").addEventListener("submit", function(e){
  e.preventDefault();
  const pw = document.getElementById("pw");
  if (pw.value === ADMIN_PW) { sessionStorage.setItem(KEY,"1"); unlock(); }
  else { document.getElementById("lock-err").hidden = false; pw.value=""; pw.focus(); }
});
</script>

<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// =============================================================
// 챗봇 문서 고치기
//
// 지우기는 없습니다. 대신 "숨김"으로 내려 둡니다.
// 한 번 적은 문서를 실수로 없애지 않기 위해서입니다.
// 숨긴 문서는 챗봇이 읽지 않습니다.
// =============================================================
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = v => String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
let DOCS = [];

function say(t, ok) { $("msg").textContent = t; $("msg").style.color = ok ? "#1F7A3D" : "#BE5427"; }

function when(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("sv-SE", { timeZone: "Asia/Seoul" }) + " " +
         d.toLocaleTimeString("ko-KR", { timeZone:"Asia/Seoul", hour:"2-digit", minute:"2-digit", hour12:false });
}

async function load() {
  say("불러오는 중입니다...");
  const { data, error } = await db.from("faq_docs")
    .select("id,sort_order,title,content,is_active,updated_at")
    .order("sort_order");
  if (error) { say("불러오지 못했습니다. (" + error.message + ")"); return; }
  DOCS = data;
  say(data.length + "개 문서를 불러왔습니다.", true);
  draw();
}

function draw() {
  $("list").innerHTML = DOCS.map(function (d) {
    return '<div class="doc ' + (d.is_active ? "" : "off") + '" data-id="' + d.id + '">' +
      '<div class="doc-head">' +
        '<span class="no">' + d.sort_order + '번</span>' +
        (d.is_active ? '' : '<span class="tag">숨김 · 챗봇이 읽지 않습니다</span>') +
        '<span class="when">고친 때 ' + when(d.updated_at) + '</span>' +
      '</div>' +
      '<input type="text" class="t" value="' + esc(d.title) + '">' +
      '<textarea class="c">' + esc(d.content) + '</textarea>' +
      '<div class="doc-foot">' +
        '<button class="save">저장</button>' +
        '<button class="ghost toggle">' + (d.is_active ? "숨기기" : "다시 보이기") + '</button>' +
        '<span class="state"></span>' +
      '</div>' +
    '</div>';
  }).join("");
}

// 고친 곳 표시
$("list").addEventListener("input", function (e) {
  const box = e.target.closest(".doc");
  if (!box) return;
  const st = box.querySelector(".state");
  st.textContent = "고쳤습니다. 저장을 눌러 주십시오";
  st.className = "state dirty";
});

$("list").addEventListener("click", async function (e) {
  const box = e.target.closest(".doc");
  if (!box) return;
  const id = Number(box.dataset.id);
  const doc = DOCS.find(d => d.id === id);
  const st = box.querySelector(".state");

  if (e.target.classList.contains("save")) {
    const title = box.querySelector(".t").value.trim();
    const content = box.querySelector(".c").value.trim();
    if (title === "" || content === "") { st.textContent = "제목과 내용을 채워 주십시오"; st.className="state dirty"; return; }
    e.target.disabled = true; st.textContent = "저장 중입니다..."; st.className = "state";
    const { error } = await db.from("faq_docs").update({ title, content }).eq("id", id);
    e.target.disabled = false;
    if (error) { st.textContent = "저장하지 못했습니다"; st.className="state dirty"; return; }
    doc.title = title; doc.content = content;
    st.textContent = "저장했습니다 · 챗봇에 바로 반영됩니다"; st.className = "state saved";
  }

  if (e.target.classList.contains("toggle")) {
    const next = !doc.is_active;
    e.target.disabled = true;
    const { error } = await db.from("faq_docs").update({ is_active: next }).eq("id", id);
    e.target.disabled = false;
    if (error) { st.textContent = "바꾸지 못했습니다"; st.className="state dirty"; return; }
    doc.is_active = next;
    draw();
    say(next ? "다시 보이게 했습니다." : "숨겼습니다. 챗봇이 읽지 않습니다.", true);
  }
});

$("add").addEventListener("click", async function () {
  const max = DOCS.reduce((m,d) => Math.max(m, d.sort_order), 0);
  const { error } = await db.from("faq_docs").insert({
    sort_order: max + 10, title: "새 문서", content: "여기에 내용을 적어 주십시오."
  });
  if (error) { say("만들지 못했습니다. (" + error.message + ")"); return; }
  await load();
  window.scrollTo(0, document.body.scrollHeight);
});

$("reload").addEventListener("click", load);
window.start = load;
if (!main.hidden) load();
</script>
</body>
</html>
